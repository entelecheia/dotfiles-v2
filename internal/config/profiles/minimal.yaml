modules:
  packages:
    enabled: true
  shell:
    enabled: true
  node:
    enabled: true
  git:
    enabled: true
    signing: false
  ssh:
    enabled: true
  terminal:
    enabled: true
    warp: false
    prompt_style: minimal
  # Shared `container` command (apple/container on macOS, docker or podman
  # on Linux). Opt-in: dot container setup enables it in user state.
  container:
    enabled: false

packages:
  - git
  - git-lfs
  - gh
  - age
  - rsync
  - fzf
  - ripgrep
  - fd
  - bat
  - jq
  - yq
  - direnv
  - zoxide
  - eza
  - starship
  - curl
  - fnm
