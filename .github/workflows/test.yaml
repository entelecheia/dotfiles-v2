name: Test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".goreleaser.yaml"
      - ".golangci.yml"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Unit tests with coverage
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Build binary
        run: go build -o bin/dot ./cmd/dot/
      - run: ./bin/dot --help
      - run: ./bin/dot version
      - name: Reject init-time terminal queries
        run: bash scripts/check-terminal-query.sh ./bin/dot
      - name: Ensure shellcheck (macOS)
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Shellcheck scripts
        run: shellcheck scripts/install.sh scripts/check-terminal-query.sh
      - run: bash -n scripts/install.sh scripts/check-terminal-query.sh
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [ubuntu-24.04]
        profile: [minimal, full, server]
        include:
          # Minimal/server-stripped base image — only meaningful for server profile.
          - dockerfile: server
            profile: server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -o dot ./cmd/dot/
      - uses: docker/setup-buildx-action@v3
      - name: Build image + run profile
        env:
          TAG: dotfiles-test:${{ matrix.dockerfile }}
          SCOPE: integration-${{ matrix.dockerfile }}
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$SCOPE" \
            --cache-to "type=gha,mode=max,scope=$SCOPE" \
            -t "$TAG" -f "tests/Dockerfile.${{ matrix.dockerfile }}" .
          docker run --rm "$TAG" /tests/run-profile.sh "${{ matrix.profile }}"

  linux:
    # Combined module + scenario suite: one image build, N fresh-container runs.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: dotfiles-test:linux
      MODULES: "packages shell node git ssh terminal tmux ai conda"
      SCENARIOS: "dry-run-all-profiles init-and-apply idempotency server-profile upgrade-check home-override workspace profile-snapshot sync install-script"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -o dot ./cmd/dot/
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        env:
          SCOPE: linux-ubuntu-22.04
        run: |
          docker buildx build --load \
            --cache-from "type=gha,scope=$SCOPE" \
            --cache-to "type=gha,mode=max,scope=$SCOPE" \
            -t "$TAG" -f tests/Dockerfile.ubuntu-22.04 .
      - name: Modules
        run: |
          failed=()
          for m in $MODULES; do
            echo "::group::module $m"
            if ! docker run --rm "$TAG" /tests/run-module.sh "$m"; then
              failed+=("$m")
              echo "::error::module $m failed"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed modules: ${failed[*]}"
            exit 1
          fi
      - name: Scenarios
        if: always()
        run: |
          failed=()
          for s in $SCENARIOS; do
            echo "::group::scenario $s"
            if ! docker run --rm "$TAG" "/tests/scenarios/$s.sh"; then
              failed+=("$s")
              echo "::error::scenario $s failed"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed scenarios: ${failed[*]}"
            exit 1
          fi

  apps-install-macos:
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -o bin/dot ./cmd/dot/
      - name: Ensure jq is present
        run: command -v jq >/dev/null || brew install jq
      - name: Install defaults and verify /Applications
        run: bash tests/scenarios/apps-install-macos.sh
      - name: macapps module and command scenario
        run: bash tests/scenarios/macapps.sh
